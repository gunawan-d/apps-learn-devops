<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sedang Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                         Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: spin 4s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 10px;
            opacity: 0.95;
        }

        .eta {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .eta strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .container { padding: 40px 25px; }
            .icon { font-size: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚙️</div>
        <h1>Sedang Maintenance</h1>
        <p>Kami sedang melakukan perbaikan sistem untuk memberikan pengalaman yang lebih baik.</p>
        <p>Mohon maaf atas ketidaknyamanannya. Silakan kembali beberapa saat lagi.</p>
        <div class="eta">
            <strong>Estimasi Selesai</strong>
            Segera
        </div>
    </div>
</body>
</html>
