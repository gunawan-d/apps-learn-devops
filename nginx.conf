server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve file statis dari /usr/share/nginx/html
    location / {
        try_files $uri $uri/ =404;
    }

    # Endpoint healthcheck (lebih ringan dari wget index)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cache kecil untuk development
    location ~* \.(html|css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}