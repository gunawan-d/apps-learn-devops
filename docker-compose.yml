services:
  maintenance:
    # Image name & tag
    image: maintenance-page:latest

    # Build dari local Dockerfile kalau image belum ada / ada perubahan
    build:
      context: .test/
      dockerfile: Dockerfile

    container_name: maintenance-2

    # Port mapping — left side customizable via .env
    ports:
      - "${PORT:-8081}:80"

    # Restart policy: kalau host restart, container auto-start
    # kecuali di-stop manual
    restart: unless-stopped

    # Healthcheck (override yang di Dockerfile, optional)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # Resource limits (opsional — uncomment untuk production)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 128M
    #     reservations:
    #       cpus: "0.1"
    #       memory: 32M

    # Logging — batasi ukuran log supaya tidak membengkak
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Network default (bridge) — cukup untuk single container
    # networks:
    #   - maintenance-net

# networks:
#   maintenance-net:
#     driver: bridge